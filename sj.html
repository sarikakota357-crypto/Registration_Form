<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login & Registration</title>
   ,<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
    background: #f0f2f5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}

.form-container {
    background: #ffffff;
    padding: 30px;
    border-radius: 8px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    width: 100%;
    max-width: 500px;
}

h2 {
    text-align: center;
    margin-bottom: 25px;
    color: #333333;
}

.form-group {
    margin-bottom: 18px;
}

label {
    display: block;
    margin-bottom: 8px;
    color: #555555;
    font-weight: 600;
    font-size: 14px;
}

input, select {
    width: 100%;
    padding: 12px;
    border: 1px solid #cccccc;
    border-radius: 4px;
    font-size: 15px;
    outline: none;
    transition: border-color 0.3s ease;
}

input:focus, select:focus {
    border-color: #007bff;
}

#statusMessage {
    margin-bottom: 15px;
    font-size: 14px;
    font-weight: bold;
    text-align: center;
}

.error-text {
    color: #dc3545;
}

.success-text {
    color: #28a745;
}

.submit-btn {
    width: 100%;
    padding: 12px;
    background: #007bff;
    color: #ffffff;
    border: none;
    border-radius: 4px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.3s ease;
}

.submit-btn:hover {
    background: #0056b3;
}

/* Styled Container to output the submitted student data details */
.data-display {
    margin-top: 25px;
    padding: 15px;
    background: #f8f9fa;
    border-left: 4px solid #28a745;
    border-radius: 4px;
}

.data-display h3 {
    margin-bottom: 10px;
    color: #333;
    font-size: 16px;
}

.data-display p {
    font-size: 14px;
    color: #555;
    margin-bottom: 5px;
    line-height: 1.4;
}
   </style>
</head>
<body>
    <div class="form-container">
        <h2>Student Registration</h2>
        <form id="registrationForm" novalidate>
            <!-- Full Name -->
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" placeholder="Enter your full name">
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email">
            </div>

            <!-- Phone Number -->
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" maxlength="10" id="phone" placeholder="10-digit mobile number">
            </div>

            <!-- Course Selection -->
            <div class="form-group">
                <label for="course">Select Course</label>
                <select id="course">
                    <option value="" selected>Choose a course</option>
                    <option value="Computer Science">Computer Science</option>
                    <option value="Information Technology">Information Technology</option>
                    <option value="Business Administration">Business Administration</option>
                    <option value="Engineering">Engineering</option>
                </select>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Create a password">
                    <i class="fas fa-eye toggle-password" id="togglePassword"></i>
                </div>
            </div>

            <!-- Confirm Password -->
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                       <div class="password-wrapper">
                <input type="password" id="confirmPassword" placeholder="Confirm your password">
                <i class="fas fa-eye toggle-password" id="toggleConfirmPassword"></i>
            </div>
            </div>
            <!-- Global Status Message Container -->
            <div id="statusMessage"></div>

            <!-- Login Button -->
            <button type="submit" class="submit-btn">Login</button>
        </form>

        <!-- Container to display student data on successful entry -->
        <div id="dataDisplay" class="data-display" style="display: none;"></div>
    </div>
    <!-- <script src="sj.js"></script> -->
</body>
</html>
<script>
    document.getElementById('registrationForm').addEventListener('submit', function(event) {
    // Prevent standard browser reloading behavior
    event.preventDefault();

    // Grab elements for manipulation
    const statusMsg = document.getElementById('statusMessage');
    const dataDisplay = document.getElementById('dataDisplay');

    // Retrieve input values
    const fullName = document.getElementById('fullName').value.trim();
    const email = document.getElementById('email').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const course = document.getElementById('course').value;
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    // Reset previous states
    statusMsg.innerHTML = '';
    dataDisplay.style.display = 'none';
    dataDisplay.innerHTML = '';

    // Check if ANY of the input fields are left blank
    if (!fullName || !email || !phone || !course || !password || !confirmPassword) {
        statusMsg.className = 'error-text';
        statusMsg.innerText = 'Please enter full details';
        return; // Halt execution early
    }

    // Optional Check: Ensure passwords match if everything is filled
    if (password !== confirmPassword) {
        statusMsg.className = 'error-text';
        statusMsg.innerText = 'Passwords do not match.';
        return;
    }

    // Success state: display notification text and build output block
    statusMsg.className = 'success-text';
    statusMsg.innerText = 'All details received successfully!';

    // Render structural text fields inside the output block on screen
    dataDisplay.innerHTML = `
        <h3>Registered Student Information:</h3>
        <p><strong>Full Name:</strong> ${fullName}</p>
        <p><strong>Email Address:</strong> ${email}</p>
        <p><strong>Phone Number:</strong> ${phone}</p>
        <p><strong>Selected Course:</strong> ${course}</p>
        <p><strong>Password Structure:</strong> ${'*'.repeat(password.length)} (Secured)</p>
    `;
    
    // Reveal hidden output panel block
    dataDisplay.style.display = 'block';
});
</script>
